# Publica um modelo pronto (o zip "laika_pacote" que a célula 6 do Colab gerou) como release do GitHub.
# Disparado pelo app (tela Treinar → Modelos prontos → "Publicar no GitHub"): o zip vai do artefato para o
# release aqui no servidor, sem passar pelo celular.
name: Publicar versão
run-name: publicar ${{ inputs.nome }}

on:
  workflow_dispatch:
    inputs:
      artefato:
        description: "id do artefato laika_pacote"
        required: true
      nome:
        description: "nome da versão (ex.: Laika 1.12)"
        required: true
      notas:
        description: "o que mudou (opcional)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o zip do artefato
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTEFATO: ${{ inputs.artefato }}
        run: |
          case "$ARTEFATO" in ''|*[!0-9]*) echo "id de artefato inválido: $ARTEFATO"; exit 1;; esac
          gh api "repos/$REPO/actions/artifacts/$ARTEFATO/zip" > laika_pacote.zip
          tamanho=$(stat -c %s laika_pacote.zip)
          echo "zip: $((tamanho / 1048576)) MB"
          if [ "$tamanho" -ge 2147483648 ]; then
            echo "O zip passa de 2 GB, o limite de um arquivo de release. Exporte de novo sem o índice do RAG."
            exit 1
          fi
          unzip -l laika_pacote.zip | tail -n 15

      - name: Criar o release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NOME: ${{ inputs.nome }}
          NOTAS: ${{ inputs.notas }}
        run: |
          tag="laika-$(date -u +%Y%m%d-%H%M%S)"
          arquivo="$(printf '%s' "$NOME" | iconv -f utf-8 -t ascii//TRANSLIT | tr -cs 'A-Za-z0-9' '_' | sed 's/^_*//;s/_*$//')"
          arquivo="${arquivo:-laika}.zip"
          mv laika_pacote.zip "$arquivo"
          texto="${NOTAS:-Modelo da Laika.}

          Para usar no celular: baixe o zip e importe no app (Versões e backups → Escolher arquivos)."
          gh release create "$tag" "$arquivo" --repo "$REPO" --title "$NOME" --notes "$texto"
          echo "Release criado: https://github.com/$REPO/releases/tag/$tag"
