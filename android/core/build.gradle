// Núcleo em Java puro: tokenizer, transformer com KV cache, RAG, memória e geração.
// Roda no Android (app) e no computador (testes que comparam com o Python/PyTorch).
plugins {
    id "java-library"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

dependencies {
    api "androidx.sqlite:sqlite:${rootProject.sqliteVersion}"
    testImplementation "androidx.sqlite:sqlite-bundled:${rootProject.sqliteVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    // Arquivos gerados por exportar_modelo.py e core/referencias.py (os testes são pulados se faltarem).
    systemProperty "laika.assets", file("../app/src/main/assets").absolutePath
    systemProperty "laika.referencias", file("build/referencias").absolutePath
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = "full"
    }
}
