// Núcleo em Java puro: tokenizer, transformer com KV cache, RAG, memória, geração, versões,
// importação (inclusive o zip do Colab) e o cliente do GitHub que liga as células do Colab.
// Roda no Android (app) e no computador (testes que comparam com o Python/PyTorch).
plugins {
    id "java-library"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

dependencies {
    api "androidx.sqlite:sqlite:${rootProject.sqliteVersion}"
    testImplementation "androidx.sqlite:sqlite-bundled:${rootProject.sqliteVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    maxHeapSize = "2g"
    // Arquivos gerados por exportar_modelo.py e core/referencias.py (os testes são pulados se faltarem).
    systemProperty "laika.assets", System.getenv("LAIKA_ASSETS") ?: file("../app/src/main/assets").absolutePath
    systemProperty "laika.referencias", file("build/referencias").absolutePath
    // Pasta com finetuned.pt, pretrain_best.pt e tokenizer.json (testes da importação no app).
    systemProperty "laika.livros", System.getenv("LAIKA_LIVROS") ?: "none"
    systemProperty "laika.ragdb", System.getenv("LAIKA_RAG_DB") ?: ""
    systemProperty "laika.repo", file("../..").absolutePath
    systemProperty "laika.checkpoints", System.getenv("LAIKA_CHECKPOINTS") ?: file("../../checkpoints").absolutePath
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = "full"
    }
}
