plugins {
    id "com.android.application"
}

android {
    namespace "com.brunodevpro.laika"
    compileSdk 35

    defaultConfig {
        applicationId "com.brunodevpro.laika"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de depuração da máquina: dá para instalar direto (fora da Play Store).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        // data/modern e data/qa do repositório vão no APK (o mínimo para o fine-tuning no celular)
        main.assets.srcDirs += ["$buildDir/dados_assets"]
    }

    androidResources {
        // Pesos e índice sem compressão: o APK quase não muda de tamanho e a leitura é mais rápida.
        noCompress += ["bin", "db"]
    }
}

dependencies {
    implementation project(":core")
    // SQLite próprio com FTS5 (o do sistema Android nem sempre tem), para o laika_rag.db.
    implementation "androidx.sqlite:sqlite-bundled:${rootProject.sqliteVersion}"
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.core:core:1.13.1"
}

tasks.register("copiarDados", Copy) {
    from("../../data/modern") { into "dados/modern" }
    from("../../data/qa") { into "dados/qa" }
    into "$buildDir/dados_assets"
}
tasks.named("preBuild") { dependsOn "copiarDados" }
